name: Dockerized Backend CI/CD Deploy

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Build & Deploy Container to GCP VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            # Navigate to backend repo directory
            cd ~/drepto-mobileApp-backend || cd /home/${{ secrets.GCP_VM_USER }}/drepto-mobileApp-backend
            
            # Make deploy script executable and run it
            chmod +x deploy.sh
            ./deploy.sh