version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: drepto-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drepto-backend
    restart: always
    ports:
      - "6001:6001"
    env_file:
      - .env
    environment:
      - PORT=6001
    depends_on:
      - redis

volumes:
  redis_data:
